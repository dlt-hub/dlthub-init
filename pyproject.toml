[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlthub-init"
version = "0.3.0"
description = "Create a dltHub workspace with `dlthub init` and set up your coding agent."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "dltHub" },
]
classifiers = [
  "Development Status :: 4 - Beta",
]
dependencies = [
  # 1.27 is the first dlt with `dlthub init` and `dlthub ai init`
  "dlt>=1.27.2",
  "packaging>=23",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/dlt-hub/dlthub-init"
Repository = "https://github.com/dlt-hub/dlthub-init"
Issues = "https://github.com/dlt-hub/dlthub-init/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  # Cap below 0.16: it enables new default lint rules that need a separate migration.
  "ruff>=0.6,<0.16",
  "mypy>=1.10",
]

[project.scripts]
dlthub-init = "dlthub_init.cli:main"

[tool.uv]
# develop and test against the first dlt pre-release that merges into existing projects
constraint-dependencies = ["dlt>=1.33.0a2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false
strict_optional = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
namespace_packages = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "tests", "tests_integration"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests_integration.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dlthub_init"]

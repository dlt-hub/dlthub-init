[project]
name = "dlthub-agent-workspace"
version = "0.1.0"
description = "Dev-only workspace for exercising background agent jobs against a dltHub stack."
# Unbounded makes uv solve for a Python dlthub-client has no release for.
requires-python = ">=3.12, <3.15"
dependencies = [
    # Exact: the agent launcher (dlt-hub/dlt#4417) is not in any stable release.
    "dlt[duckdb,hub]==1.30.1a0",
    # For fastmcp: the loop spawns `dlthub ai mcp run --stdio` and nothing else pulls it in.
    # Without it the server never starts and the agent silently has no tools.
    "dlthub[mcp]",
    # Exact: the released 0.28.4 predates the platform MCP tools at a *higher* version number.
    "dlthub-client==0.28.5a1",
    # dlt declares its loops as PEP 735 dependency groups, which do not ship in the wheel,
    # so the workspace names them itself. Floors are dlt's own (`agent`, `agent-claude`).
    # Without the pydantic-ai floor the resolver walks back to 0.2.4, which has no
    # `ToolFailed` and imports an `opentelemetry._events` that otel-api 1.44 removed; both
    # surface as a MissingDependencyException naming a package that is already installed.
    "pydantic-ai-slim[anthropic,openai,google,mcp,spec]>=2.35.0",
    "aiohttp>=3.14.3",
    "claude-agent-sdk>=0.2.144",
]


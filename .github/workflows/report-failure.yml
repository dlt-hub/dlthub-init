# Installed by the engineering agent loop. Edit it in dlt-hub/engineering-agent-loop, not here.
name: report-failure

on:
  workflow_run:
    workflows: [triage, dispatch, review]
    types: [completed]

permissions:
  actions: read
  # a pull request comment is refused with `issues: read` alone, though both are written
  # through the issues API
  issues: read
  pull-requests: read

jobs:
  report-failure:
    # a run whose every job skipped decided not to start and said so itself
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Ask whether this run left its ticket with nothing
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # this job has no checkout, so `gh` cannot resolve the repository without it
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # the workflow name, not the run name, which carries the ticket number
          STAGE: ${{ github.event.workflow.name }}
          # the stage puts the ticket number in its run name, the only place a finished
          # run still carries it
          TITLE: ${{ github.event.workflow_run.display_title }}
          SINCE: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail

          NUMBER=$(printf '%s' "$TITLE" | sed -n 's/.*#\([0-9][0-9]*\).*/\1/p')
          if [ -z "$NUMBER" ]; then
            echo "::notice::run $RUN_ID names no issue or pull request."
            exit 0
          fi

          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          conclusion_of() {
            jq -r --arg n "$1" '[.jobs[] | select(.name == $n)][0].conclusion // ""' /tmp/jobs.json
          }

          # `safe_outputs` writes every result this loop produces, so a run whose writer
          # job succeeded has already said what it had to
          if [ "$(conclusion_of safe_outputs)" = "success" ]; then
            echo "::notice::run $RUN_ID wrote its own result on #$NUMBER."
            exit 0
          fi

          # the furthest job the run reached. `conclusion` is left out: nothing reads what
          # it writes and it is red whenever an earlier job is
          FAILED=$(jq -r '
            [ .jobs[]
              | select(.name != "conclusion")
              | select(.conclusion == "failure" or .conclusion == "cancelled"
                       or .conclusion == "timed_out") ]
            | if length == 0 then "" else .[-1].name end' /tmp/jobs.json)

          STEP=""
          if [ -n "$FAILED" ]; then
            STEP=$(jq -r --arg n "$FAILED" '
              [.jobs[] | select(.name == $n)][0].steps // []
              | map(select(.conclusion == "failure" or .conclusion == "cancelled"
                           or .conclusion == "timed_out"))
              | if length == 0 then "" else .[0].name end' /tmp/jobs.json)
          elif [ "$(conclusion_of activation)" = "success" ] \
            && [ "$(conclusion_of agent)" = "skipped" ]; then
            # the one stop that fails no job
            FAILED=daily-budget
          else
            echo "::notice::run $RUN_ID failed no job, so there is nothing to report on #$NUMBER."
            exit 0
          fi

          # a run may already have reported itself from inside `safe_outputs`. `since`
          # because this endpoint takes no `sort` and ignores one
          if gh api "repos/$GH_REPO/issues/$NUMBER/comments?per_page=100&since=$SINCE" \
               --jq '.[] | select(.body | contains("agent-loop: failure notice")
                                          or contains("agent-loop: run notice")) | .body' \
               > /tmp/loop-comments.txt; then
            if grep -qF "/actions/runs/$RUN_ID" /tmp/loop-comments.txt; then
              echo "::notice::run $RUN_ID has already been reported on #$NUMBER."
              exit 0
            fi
          else
            # a second notice is worth more than a missing one
            echo "::warning::could not read the comments on #$NUMBER, so this may repeat a"
            echo "::warning::notice the run has already written there."
          fi

          # a cancelled run is read off the run rather than off the job it stopped in
          if [ "$RUN_CONCLUSION" = cancelled ]; then
            FAILED=cancelled
            STEP=""
          fi

          case "$FAILED" in
            cancelled)
              WHAT='The run was cancelled before it finished, so nothing it produced was written.' ;;
            daily-budget)
              WHAT='No model was started: this repository'"'"'s daily AI credit budget was already spent when the run began. That budget is `GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS`, a variable on this repository.' ;;
            event_filter|pre_activation)
              WHAT='It stopped before any work began, in one of the checks this workflow makes first.' ;;
            activation)
              WHAT='It stopped before the agent started. The commonest reason is that the workflow file and the generated copy beside it no longer match each other, which a fresh deployment fixes.' ;;
            agent)
              WHAT='The pass itself failed, and the step that reports a failed pass here did not run.' ;;
            detection)
              WHAT='The second model that reads a pass'"'"'s output before anything is written reached no verdict, so nothing the pass produced was written.' ;;
            safe_outputs)
              WHAT='The pass finished, and the step that writes its result into this repository failed. Nothing it produced was written.' ;;
            *)
              WHAT="It stopped in its \`$FAILED\` job." ;;
          esac

          {
            echo '<!-- agent-loop: run notice -->'
            echo
            echo "### The \`$STAGE\` run did not finish"
            echo
            echo "$WHAT"
            echo
            if [ -n "$STEP" ]; then
              echo "The step that failed is \`$STEP\`."
              echo
            fi
            echo "The run is at $RUN_URL."
            echo
            echo '`agent:needs-human` is applied, and nothing else was written by this run.'
            echo 'Fix the cause, then start this stage again.'
          } > /tmp/agent-loop-run-notice.md

          echo "::notice::run $RUN_ID stopped at $FAILED; reporting it on #$NUMBER."
          {
            echo "report=true"
            echo "number=$NUMBER"
          } >> "$GITHUB_OUTPUT"

      # every write goes through the loop's App, and may fail without reddening this run
      - name: Generate an App token for the notice
        id: app-token
        if: steps.decide.outputs.report == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_LOOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_LOOP_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          # a comment or a label on a pull request is refused without this, though both
          # go through the issues API
          permission-pull-requests: write

      - name: Say on the ticket that the run did not finish
        if: steps.decide.outputs.report == 'true' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.decide.outputs.number }}
        # independent, so a refused label does not hide a posted comment
        run: |
          rc=0
          gh api --method POST "repos/$GH_REPO/issues/$NUMBER/comments" \
            -F body=@- --silent < /tmp/agent-loop-run-notice.md || rc=1
          gh api --method POST "repos/$GH_REPO/issues/$NUMBER/labels" \
            -f 'labels[]=agent:needs-human' --silent || rc=1
          exit $rc
